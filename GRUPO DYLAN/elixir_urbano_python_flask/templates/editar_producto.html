<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editar Producto - Elixir Urbano</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    {% for category, message in messages %}
      <div class="flash {{ category }}">{{ message }}</div>
    {% endfor %}
  {% endif %}
{% endwith %}

<header class="header">
  <h1>Editar Producto</h1>
  <p>Actualiza la información del inventario</p>
  <nav class="nav">
    <a href="{{ url_for('productos') }}">Volver a productos</a>
    <a href="{{ url_for('index') }}">Inicio</a>
  </nav>
</header>

<section class="card">
  <h2>Editar producto</h2>
  <form method="post">
    <div class="form-grid">
      <div class="form-group">
        <label>Nombre</label>
        <input type="text" name="nombre" value="{{ producto.nombre }}" required>
      </div>
      <div class="form-group">
        <label>Precio</label>
        <input type="number" step="0.01" name="precio" value="{{ producto.precio }}" required>
      </div>
      <div class="form-group">
        <label>URL imagen</label>
        <input type="text" name="imagen" value="{{ producto.imagen or '' }}">
      </div>
      <div class="form-group">
        <label>Descripción</label>
        <input type="text" name="descripcion" value="{{ producto.descripcion or '' }}">
      </div>
    </div>
    <p style="text-align:center; margin-top:1rem;">
      <button class="btn" type="submit">Actualizar</button>
      <a class="btn btn-secondary" href="{{ url_for('productos') }}">Cancelar</a>
    </p>
  </form>
</section>
</body>
</html>
